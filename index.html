<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Taboo Jr</title>
  <meta name="description" content="A kid-friendly Taboo word game for mobile — pick categories and swipe through the cards." />
  <meta name="theme-color" content="#6d28d9" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- SETUP SCREEN -->
    <section id="screen-setup" class="screen">
      <h1 class="title">🎉 Taboo Jr</h1>
      <p class="subtitle">Say the word. Don't say the taboo words!</p>

      <div class="card">
        <h2>Difficulty</h2>
        <div class="pill-group" id="difficulty-group">
          <button class="pill selected" data-difficulty="easy">Easy only</button>
          <button class="pill" data-difficulty="all">Easy + Medium</button>
        </div>
      </div>

      <div class="card">
        <h2>Categories</h2>
        <div class="pill-group" id="category-group">
          <button class="pill selected" data-category="all">All</button>
          <button class="pill" data-category="animals">Animals</button>
          <button class="pill" data-category="food">Food</button>
          <button class="pill" data-category="school">School</button>
          <button class="pill" data-category="sports">Sports</button>
          <button class="pill" data-category="movies">Fantasy &amp; Fun</button>
          <button class="pill" data-category="everyday">Everyday</button>
        </div>
      </div>

      <button id="start-btn" class="big-btn go">Start Playing ▶</button>
    </section>

    <!-- CARDS SCREEN -->
    <section id="screen-cards" class="screen hidden">
      <div class="cards-header">
        <button id="change-categories-btn" class="text-btn">◂ Categories</button>
        <div class="category-label" id="category-label">All Categories</div>
      </div>

      <div class="card-stack">
        <div class="word-card" id="word-card">
          <div class="target-word" id="target-word">Ready?</div>
          <div class="taboo-list" id="taboo-list"></div>
        </div>
      </div>

      <div class="swipe-hint">‹ swipe to browse ›</div>

      <div class="nav-row">
        <button id="prev-btn" class="nav-btn" aria-label="Previous word">‹</button>
        <button id="next-btn" class="nav-btn" aria-label="Next word">›</button>
      </div>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
